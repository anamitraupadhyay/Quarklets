plugins {
    id 'java'
    id 'io.quarkus' version '3.30.1'
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
}

dependencies {
    implementation enforcedPlatform('io.quarkus.platform:quarkus-bom:3.30.1')
    implementation 'io.quarkus:quarkus-undertow'
    implementation 'io.quarkus:quarkus-arc'
    
    // Add these essential Quarkus dependencies
    implementation 'io.quarkus:quarkus-bootstrap-runner'
    implementation 'io.quarkus:quarkus-core'
    
    testImplementation 'io.quarkus:quarkus-junit5'
    
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    
    // Your library
    implementation "io.github.anamitraupadhyay:lib:1.0.0-SNAPSHOT"
}

group 'org.example'
version '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}